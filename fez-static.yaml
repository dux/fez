# GitHub Pages serves this repo from main /docs, so the generated site is its own root
source_dir: docs_src
target_dir: docs

site:
  title: Fez
  description: JavaScript DOM components framework
  fez_url: fez.min.js
  components:
    - /site.fez
    - /fez/fez-control.fez

copy:
  "dist/fez.min.js": "fez.min.js"
  "dist/fez.min.js.map": "fez.min.js.map"
  # docs.html renders the README, and vscode snippets link to /fez/dist/fez.js
  "README.md": "README.md"
  "dist": "dist"

collections:
  changelog:
    required: [title, description, date]
