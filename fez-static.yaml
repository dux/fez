# GitHub Pages serves the `pages` branch at its root; bin/deploy copies this
# generated site there. tmp/ is ignored, so main only tracks source.
source_dir: pages_src
target_dir: tmp/fez-pages

site:
  title: Fez
  description: JavaScript DOM components framework
  fez_url: fez.min.js
  components:
    - /site.fez
    - /fez/fez-control.fez

copy:
  "dist/fez.min.js": "fez.min.js"
  "dist/fez.min.js.map": "fez.min.js.map"
  # docs.html renders the README, and vscode snippets link to /fez/dist/fez.js
  "README.md": "README.md"
  "dist": "dist"

collections:
  changelog:
    required: [title, description, date]
