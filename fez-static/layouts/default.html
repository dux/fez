<!doctype html>
<html lang="en">
  <head>
    <base href={page.base}>
    {@include "head.html"}
  </head>
  <body class="site">
    {#if page.shell !== false}
      <site-nav></site-nav>
    {/if}
    <main id={page.shell === false ? '' : 'pjax'} class={page.collection ? 'pjax site-wrap site-text site-md' : page.format === 'md' ? 'pjax site-wrap site-docs site-md' : page.shell === false ? '' : 'pjax'}>
      {#if page.collection}
        <nav class="article-nav" aria-label="Changelog navigation">
          <a href={url('/changelog/')}>Back to changelog</a>
          <div class="article-meta">
            <span>{page.date}</span>
            <span>{page.tags.join(' / ')}</span>
          </div>
        </nav>
        <div class="commit-list" aria-label="Source commits">
          {#each page.commits as commit}
            <a href="https://github.com/dux/fez/commit/{commit}" class="no-pjax" target="_blank">{commit}</a>
          {/each}
        </div>
        {#if page.image}
          <img class="article-hero" src={url('/changelog/' + page.image)} alt={page.image_alt} decoding="async" fetchpriority="high" />
        {/if}
        <h1>{page.title}</h1>
        <p class="article-summary">{page.description}</p>
      {/if}
      {@content}
    </main>
    {#if page.shell !== false}
      <site-footer></site-footer>
    {/if}
  </body>
</html>
